name: Validate workflows
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xuzhang
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xuzhang"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOVEL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/xuzhang
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: uv run pytest -q
      - run: uv run python scripts/check_mcp.py
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag xuzhang-novel-studio:ci .
